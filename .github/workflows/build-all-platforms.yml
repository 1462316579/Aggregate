name: Build All Platforms

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============ Android (APK + AAB) ============
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK (universal)
        run: flutter build apk --release
      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ============ Web ============
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/
          retention-days: 30

  # ============ Linux ============
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package Linux tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../allplay-linux-x64.tar.gz .
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: allplay-linux-x64.tar.gz
          retention-days: 30

  # ============ Windows ============
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath allplay-windows-x64.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: allplay-windows-x64.zip
          retention-days: 30

  # ============ macOS ============
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS dmg
        run: |
          hdiutil create -volname "AllPlay" -srcfolder build/macos/Build/Products/Release/allplay.app -ov -format UDZO allplay-macos.dmg
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: allplay-macos.dmg
          retention-days: 30

  # ============ iOS (IPA for TestFlight) ============
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (Release, no codesign for artifact)
        run: |
          flutter build ios --release --no-codesign
      - name: Package iOS IPA (unsigned)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r allplay-ios.ipa Payload
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: allplay-ios.ipa
          retention-days: 30

  # ============ Create GitHub Release (after all builds) ============
  release:
    needs: [android, web, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: |
          find artifacts -type f -name "*.apk" -o -name "*.aab" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.ipa" | sort
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AllPlay Release ${{ github.run_number }} (All Platforms)
          draft: false
          prerelease: false
          files: |
            artifacts/android/app-release.apk
            artifacts/android/app-release.aab
            artifacts/web/**
            artifacts/linux/allplay-linux-x64.tar.gz
            artifacts/windows/allplay-windows-x64.zip
            artifacts/macos/allplay-macos.dmg
            artifacts/ios/allplay-ios.ipa
          body: |
            ## AllPlay Multi-Platform Release ${{ github.run_number }}
            
            **Build Time:** ${{ github.event.head_commit.timestamp }}
            **Flutter Version:** 3.16.0
            **Commit:** ${{ github.sha }}
            
            ### 📦 Downloads
            | Platform | File | Install Notes |
            |----------|------|---------------|
            | Android | `app-release.apk` | Universal ARM (arm64-v8a + armeabi-v7a) |
            | Android | `app-release.aab` | For Play Store upload |
            | Web | `web/` folder | Deploy to any static host |
            | Linux | `allplay-linux-x64.tar.gz` | Extract & run `./allplay` |
            | Windows | `allplay-windows-x64.zip` | Extract & run `allplay.exe` |
            | macOS | `allplay-macos.dmg` | Open DMG, drag to Applications |
            | iOS | `allplay-ios.ipa` | Unsigned - install via TestFlight or re-sign |
            
            ### 🔧 Build Details
            - All builds are **Release** mode (optimized, no debug symbols)
            - Android APK is **universal** (both ARM architectures)
            - iOS IPA is **unsigned** - requires re-signing for device install
            
            ### 📱 Installation
            1. Download the file for your platform
            2. Follow platform-specific install steps above
            3. Enjoy AllPlay!