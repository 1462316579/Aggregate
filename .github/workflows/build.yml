name: Build All Platforms and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.5

jobs:
  android:
    name: Android Universal APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Android host project
        run: |
          rm -rf android
          flutter create --no-pub --platforms=android --org juhe.homes --project-name app2026 .
          sed -i 's/android:label="[^"]*"/android:label="宏曦聚合"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk hongxi-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: hongxi-android-universal.apk
          if-no-files-found: error

  ios:
    name: iOS Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate iOS host project
        run: |
          rm -rf ios
          flutter create --no-pub --platforms=ios --org juhe.homes --project-name app2026 .
      - name: Set display name
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 宏曦聚合" ios/Runner/Info.plist
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry hongxi-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: hongxi-ios-unsigned.ipa
          if-no-files-found: error

  web:
    name: Web and Apple TV Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Web host project
        run: |
          rm -rf web
          flutter create --no-pub --platforms=web --org juhe.homes --project-name app2026 .
      - run: flutter pub get
      - run: flutter build web --release --base-href /
      - name: Package Web variants
        run: |
          tar -czf hongxi-web.tar.gz -C build/web .
          cp hongxi-web.tar.gz hongxi-tvos-web.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            hongxi-web.tar.gz
            hongxi-tvos-web.tar.gz
          if-no-files-found: error

  windows:
    name: Windows EXE Installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Windows host project
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          flutter create --no-pub --platforms=windows --org juhe.homes --project-name app2026 .
      - name: Prepare Windows resources
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/windows -ErrorAction SilentlyContinue
          $rc = 'windows/runner/Runner.rc'
          if (Test-Path $rc) {
            $text = Get-Content $rc -Raw
            $text = $text -replace '(?m)^.*app_icon\.ico.*\r?\n', ''
            Set-Content $rc $text
          }
      - run: flutter pub get
      - name: Build Windows executable
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          CMAKE_GENERATOR_PLATFORM: x64
        run: flutter build windows --release
      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging/windows-installer.iss
          Copy-Item build/hongxi-windows-x64-setup.exe hongxi-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: hongxi-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS DMG Installer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate macOS host project
        run: |
          rm -rf macos
          flutter create --no-pub --platforms=macos --org juhe.homes --project-name app2026 .
      - name: Set display name
        run: sed -i '' 's/PRODUCT_NAME = .*/PRODUCT_NAME = 宏曦聚合;/' macos/Runner/Configs/AppInfo.xcconfig || true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Build DMG installer
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          hdiutil create -volname "宏曦聚合" -srcfolder "$APP_PATH" -ov -format UDZO hongxi-macos-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: hongxi-macos-x64.dmg
          if-no-files-found: error

  linux:
    name: Linux DEB Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev fakeroot dpkg-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate Linux host project
        run: |
          rm -rf linux
          flutter create --no-pub --platforms=linux --org juhe.homes --project-name app2026 .
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Build DEB installer
        run: bash packaging/linux-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/release/hongxi-linux-x64.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios, web, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Add source archive
        run: tar -czf release-files/hongxi-source.tar.gz --exclude=.git --exclude=build --exclude=release-files .
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: 宏曦聚合 v1.0.0 全平台安装包
          make_latest: true
          generate_release_notes: true
          body: |
            # 宏曦聚合 v1.0.0

            - `hongxi-android-universal.apk`：Android/Android TV 通用安装包
            - `hongxi-windows-x64-setup.exe`：Windows x64 安装程序
            - `hongxi-macos-x64.dmg`：macOS 磁盘安装包
            - `hongxi-linux-x64.deb`：Debian/Ubuntu 安装包
            - `hongxi-ios-unsigned.ipa`：iOS 未签名包，需要 Apple 证书签名
            - `hongxi-web.tar.gz`：Web 版
            - `hongxi-tvos-web.tar.gz`：Apple TV Web 版
            - `hongxi-source.tar.gz`：源代码

            应用名称：宏曦聚合
            Android applicationId：`juhe.homes.app2026`
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
