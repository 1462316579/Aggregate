name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Flutter (stable)
        uses: subosito/flutter-action@v1
        with:
          flutter-version: "3.22.2"
          channel: "stable"

      - name: 🧹 Clean Flutter project
        run: flutter clean

      - name: 📦 Install dependencies
        run: |
          flutter pub get --no-packages-upgrade

      - name: 📱 Build APK (debug, split ABI)
        run: |
          flutter build apk --debug --split-per-abi

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allplay-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug-android-arm64.apk
            build/app/outputs/flutter-apk/app-debug-armv7.apk
            build/app/outputs/flutter-apk/app-debug-apk
