name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:-os-:-${{ runner.os }}-:-${{ hashFiles('**/pubspec.lock') }}'

      - name: 🧹 Clean Flutter project
        run: flutter clean

      - name: 📦 Install dependencies (with network retry)
        run: |
          set -e
          for i in 1 2 3; do
            echo "Attempt $i: flutter pub get..."
            if flutter pub get; then
              echo "✓ Dependencies installed successfully"
              exit 0
            fi
            echo "⚠ Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "✗ Failed to install dependencies after 3 attempts"
          exit 1

      - name: 📱 Build APK (debug, split ABI)
        run: |
          flutter build apk --debug --split-per-abi --verbose 2>&1 | tail -50

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allplay-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug-android-arm64.apk
            build/app/outputs/flutter-apk/app-debug-armv7.apk
          if-no-files-found: warn
          retention-days: 7
