name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Debug environment
        run: |
          echo "Flutter version:"
          flutter --version
          echo ""
          echo "Dart version:"
          dart --version
          echo ""
          echo "Java version:"
          java -version 2>&1 || echo "Java not found"
          echo ""
          echo "Working directory:"
          pwd
          echo ""
          echo "Files:"
          ls -la
      
      - name: Get dependencies
        run: |
          echo "Running flutter pub get..."
          flutter pub get || {
            echo "First attempt failed, trying again..."
            sleep 5
            flutter pub get
          }
      
      - name: Build APK
        run: flutter build apk --debug
        continue-on-error: true
      
      - name: Check build output
        run: |
          echo "Build directory contents:"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Build output not found"
          echo ""
          echo "Checking for APK:"
          find build -name "*.apk" -type f 2>/dev/null || echo "No APK found"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allplay-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7
