name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: |
          flutter pub get || {
            echo "Retry..."
            sleep 5
            flutter pub get
          }
      
      - name: Build APK
        run: |
          flutter build apk --debug 2>&1 | tee build.log
      
      - name: Check APK
        run: |
          echo "Looking for APK..."
          find build -name "*.apk" -type f -exec ls -lh {} \;
          cp build/app/outputs/flutter-apk/app-debug.apk allplay.apk 2>/dev/null || echo "APK not found"
          ls -lh allplay.apk 2>/dev/null
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allplay-debug-apk
          path: allplay.apk
          retention-days: 7
