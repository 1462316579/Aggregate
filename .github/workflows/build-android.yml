name: Build Android APK (Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: |
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      - name: Upload Release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name == 'main' && format('AllPlay v{0}', '1.0.0') || format('AllPlay v{0} ({1})', '1.0.0', github.sha) }}
          tag_name: ${{ github.ref == 'refs/heads/main' && 'v1.0.0' || github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## AllPlay APK (Release)
            - **Build type:** Release
            - **Architecture:** Universal (armeabi-v7a + arm64-v8a)
            - **Size:** ${{ steps.get_size.outputs.size }} KB
          draft: false
          prerelease: false