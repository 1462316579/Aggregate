name: Build Android APK (Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.22
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: |
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      - name: Upload Release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 宏曦聚合
          tag_name: v1.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## 宏曦聚合 APK (Release)
            - **Build type:** Release
            - **Architecture:** Universal (armeabi-v7a + arm64-v8a)
          draft: false
          prerelease: false