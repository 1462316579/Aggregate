name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
      
      - run: flutter clean
      - run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: allplay-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
