name: hongxi
description: 宏曦聚合 - 全平台影视聚合播放器
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  webview_flutter: ^4.4.0
  flutter_js: ^0.8.0
  cached_network_image: ^3.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
