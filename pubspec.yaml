name: hongxi
description: 宏曦聚合 - 全平台影视聚合播放器
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 网络
  http: ^1.1.0

  # 数据存储
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # 视频播放
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # WebView (影视嗅探)
  webview_flutter: ^4.4.0

  # 插件引擎
  flutter_js: ^0.8.0

  # UI组件
  cached_network_image: ^3.3.0

  # 工具
  intl: ^0.18.1
  collection: ^1.18.0

  # 本地化
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
