name: allplay
description: AllPlay - 全平台影视聚合播放器
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 网络
  http: ^1.2.0
  dio: ^5.4.0
  
  # 数据存储
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  
  # 视频播放
  video_player: ^2.8.6
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  
  # 解析与爬虫
  html: ^0.15.4
  xpath: ^1.4.0
  flutter_js: ^0.8.2
  
  # WebView (影视嗅探)
  webview_flutter: ^4.7.0
  
  # 插件引擎
  flutter_js: ^0.8.2
  
  # UI组件
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  
  # 工具
  intl: ^0.19.0
  uuid: ^4.2.1
  collection: ^1.18.0
  connectivity_plus: ^5.0.2
  wakelock_plus: ^1.2.1
  url_launcher: ^6.2.2
  device_info_plus: ^9.1.1
  
  # 本地化
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icon/
